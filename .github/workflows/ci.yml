# GitHub Actions CI for WoolWash-IoT.
# To activate (needs the "workflow" permission once):
#   gh auth refresh -h github.com -s workflow
#   mkdir .github\workflows & copy ci\ci.yml .github\workflows\ci.yml
#   git add .github && git commit -m "Enable CI" && git push
name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.1.1
      - uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino15-esp32-3.3.12
      - name: Install ESP32 core and libraries (pinned)
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
          arduino-cli lib install OneWire@2.3.8 DallasTemperature@4.0.6 ArduinoJson@7.4.3 PubSubClient@2.8 PZEM004Tv30@1.2.1 HX711@0.6.6
      - name: Compile
        run: arduino-cli compile --fqbn esp32:esp32:esp32:FlashMode=dio --export-binaries --output-dir build firmware/woolwash_esp32
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build/*.bin
